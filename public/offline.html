<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Prompt Playgroundz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Mono', monospace;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-family: 'Anton', sans-serif;
      font-size: 4rem;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
      line-height: 0.9;
    }

    p {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 3rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.02);
      margin-bottom: 2rem;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: #ff0000;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.5;
        transform: scale(0.8);
      }
    }

    button {
      background: #fff;
      color: #000;
      border: none;
      padding: 1rem 3rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 700;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PROMPT<br/>PLAYGROUNDZ</h1>

    <div class="status">
      <div class="pulse"></div>
      <span style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.2em;">Connection Lost</span>
    </div>

    <p>You are currently offline. Please check your internet connection.</p>

    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
